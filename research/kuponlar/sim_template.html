<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bust Kuponları</title>
<style>
  :root { --bg: #0b0d12; --panel: rgba(18,21,29,.92); --line: #2a3040; --txt: #e6e9ef; --dim: #8b93a5; --cyan: #4fd1ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; width: 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .12em; color: var(--cyan); }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  button { background: #161a23; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: var(--cyan); color: var(--cyan); }
  #title { font-size: 14px; margin-bottom: 4px; }
  #desc { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; accent-color: var(--cyan); }
  #val { width: 64px; text-align: right; font-family: Consolas, monospace; }
  #leg { margin-top: 10px; font-size: 11px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }
  #leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  @media (max-width: 600px) { #ui { left: 16px; right: 16px; width: auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>BUST · ÖLÇÜM KUPONLARI</h1>
  <div class="sub">CP3a · montaj pozları montaj.py'den · birim mm</div>
  <div id="tabs"></div>
  <div id="title"></div>
  <div id="desc"></div>
  <div class="row"><span id="sl"></span><input id="r" type="range" min="0" max="1000" value="0"><span id="val"></span></div>
  <div class="row" style="margin-top:8px"><button id="play" class="on">Oynat</button><button id="fit">Çerçevele</button></div>
  <div id="leg"><span><i style="background:#96a0af"></i>sabit / taban</span><span><i style="background:#d6783c"></i>hareketli baskı</span><span><i style="background:#5a96d2"></i>disk / orta</span><span><i style="background:#3c3c42"></i>satın alınan</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = /*DATA*/null;
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0d12);
const cam = new THREE.PerspectiveCamera(35, 1, 1, 5000); cam.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(cam, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1c22, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(200, -300, 400); scene.add(sun);
const rim = new THREE.DirectionalLight(0x4fd1ff, 0.35); rim.position.set(-300, 250, 150); scene.add(rim);
const grid = new THREE.GridHelper(400, 40, 0x2a3040, 0x161a23); grid.rotation.x = Math.PI / 2; scene.add(grid);

const b64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };
const GEO = DATA.geos.map(g => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(b64(g.v, Float32Array), 3));
  geo.setIndex(new THREE.BufferAttribute(b64(g.f, Uint32Array), 1));
  geo.computeVertexNormals();
  const satin = g.c[0] < 70;
  return { geo, mat: new THREE.MeshStandardMaterial({ color: new THREE.Color(g.c[0] / 255, g.c[1] / 255, g.c[2] / 255), roughness: satin ? 0.35 : 0.7, metalness: satin ? 0.4 : 0.05, flatShading: true }) };
});

let cur = null, meshes = [], t = 0, playing = true;
const $ = id => document.getElementById(id);
DATA.scenes.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.k; b.title = s.ad; b.onclick = () => show(i); $("tabs").appendChild(b); });

function show(i) {
  meshes.forEach(m => scene.remove(m));
  cur = DATA.scenes[i];
  [...$("tabs").children].forEach((b, j) => b.classList.toggle("on", i === j));
  meshes = cur.parts.map(gi => { const m = new THREE.Mesh(GEO[gi].geo, GEO[gi].mat); m.matrixAutoUpdate = false; m.castShadow = m.receiveShadow = true; scene.add(m); return m; });
  $("title").textContent = cur.ad; $("desc").textContent = cur.a; $("sl").textContent = cur.s;
  t = 0; apply(0); fit();
}
function apply(u) {                                        // u in [0,1]: kareler arasinda en yakin + dogrusal karisim yok (pozlar zaten sik)
  const n = cur.vals.length, k = Math.max(0, Math.min(n - 1, Math.round(u * (n - 1)))), fr = cur.frames[k];
  meshes.forEach((m, j) => { const M = fr[j]; m.visible = !!M; if (M) { m.matrix.fromArray(M); m.matrixWorldNeedsUpdate = true; } });
  $("val").textContent = cur.vals[k].toFixed(cur.u === " mm" ? 1 : 0) + cur.u;
  $("r").value = Math.round(u * 1000);
}
function fit() {
  const box = new THREE.Box3(); meshes.forEach(m => { if (m.visible) { m.updateMatrixWorld(); box.expandByObject(m); } });
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() * 0.5 || 50;
  controls.target.copy(c); cam.position.set(c.x + r * 1.6, c.y - r * 2.0, c.z + r * 1.3); cam.near = r / 50; cam.far = r * 50; cam.updateProjectionMatrix();
  grid.position.set(c.x, c.y, Math.min(0, box.min.z));
}
$("r").oninput = e => { playing = false; $("play").classList.remove("on"); t = e.target.value / 1000; apply(t); };
$("play").onclick = () => { playing = !playing; $("play").classList.toggle("on", playing); };
$("fit").onclick = fit;

function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } }
let last = performance.now();
function loop(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (playing && cur) { t = (t + dt / 4) % 2; apply(t < 1 ? t : 2 - t); }   // 4 s ileri, 4 s geri
  resize(); controls.update(); renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
show(0); requestAnimationFrame(loop);
</script>
</body>
</html>
